name: Publish Android download mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/download-mirror.yml]
  release:
    types: [published]

concurrency:
  group: android-download-mirror-${{ github.event_name == 'release' && github.run_id || 'main' }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && endsWith(github.event.release.tag_name, '-lite.1') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run Pages publishing from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download-mirror.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Copy verified release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-lite\.1$' | sort -Vr | sed -n '1,5p')
          test "${#tags[@]}" -gt 0
          mkdir -p site
          touch site/.nojekyll
          for tag in "${tags[@]}"; do
            version="${tag#v}"
            version="${version%-lite.1}"
            target="site/releases/$version"
            mkdir -p "$target"
            read -r sha256 size < <(gh release view "$tag" --json assets --jq '.assets[] | select(.name == "yougui-lite.apk") | [(.digest | sub("^sha256:"; "")), .size] | @tsv')
            [[ "$sha256" =~ ^[a-f0-9]{64}$ && "$size" =~ ^[0-9]+$ ]]
            gh release download "$tag" --pattern yougui-lite.apk --dir "$target"
            test "$(wc -c < "$target/yougui-lite.apk")" -eq "$size"
            printf '%s  %s\n' "$sha256" "$target/yougui-lite.apk" | sha256sum --check
            if [[ "$tag" == "${tags[0]}" ]]; then
              cat > site/index.html <<EOF
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>游归 Android 备用下载</title>
          <h1>游归 Android 备用下载</h1>
          <p><a href="releases/$version/yougui-lite.apk" download>下载 v$version APK</a></p>
          <p>SHA-256 <code style="overflow-wrap:anywhere">$sha256</code></p>
          <p><a href="https://yougui-preview.pages.dev/">游归官网</a></p>
          </html>
          EOF
            fi
          done
      - name: Copy the verified Music Rhythm Ball game pack
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256=5307eead9d0f7e4395d7495de59bb03f46eed435497169f1b784e7f8489ba378
          target="site/game-packs/$sha256"
          mkdir -p "$target"
          gh release download game-packs-0.5.56.1 --pattern rhythm.zip --dir "$target"
          test "$(wc -c < "$target/rhythm.zip")" -eq 178738799
          printf '%s  %s\n' "$sha256" "$target/rhythm.zip" | sha256sum --check
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
